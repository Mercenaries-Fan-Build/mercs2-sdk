; spawn_registry.ini — config for the SDK's spawn/guidmap registry diagnostics.
;
; Deploy this next to m2-sdk.dll. The SDK reads it at install and writes its diagnostics to
; m2-sdk.log in the same folder.

; Master switch. 0 installs nothing.
enabled = 1

; THE FIX: inject landing_craft's missing name->handle record into the name registry
; (0x00DF6B88) once the world is fully loaded, so GetGuidByName("landing_craft") resolves.
; Replicates base's own name-insert call exactly; insert-if-absent, so it is a no-op if the
; name is ever already present.
inject_name = 1

; Observe-only probe on the registry bucket-insert (FUN_00649180). Logs only when the
; landing_craft handle (0x8000B3C5) or hash (0x46AE2245) reaches an insert, and into which
; table. Diagnostic — safe to leave on alongside the injection, or set 0 to quiet the log.
probe_insert = 1

; Install the FUN_004CC130 force-create detour. PROVEN THE WRONG GATE — it never took a
; gated hit in a full load — so it is OFF by default. Only set to 1 to re-test that path.
force_gate = 0

; Per-type gates for the force-create path above (only matter when force_gate = 1).
hook_guidmap = 1
hook_worldentity = 1
