name: Release

# Publishes m2-sdk.dll, its import library, the headers, and the m2-sdk Quartermaster Shipment.
#
# The Shipment (m2-sdk-v<version>.zip) is how players get m2-sdk.dll: it places the DLL in the game
# root, where every .asi that imports it finds it. `libm2-sdk.dll.a` is what a mod's linker binds
# against if it is not building the DLL itself, and the headers are what it compiles against.
#
# Two triggers:
#   * workflow_dispatch with a version: stamps shipment.version in manifest.yaml on the default branch,
#     builds and checks everything, then commits the stamp, tags v<version> and creates the release.
#   * a pushed v* tag: the committed manifest.yaml must already carry the tagged version, or the
#     release stops.
# Either way the version is injected into the DLL, and the release is created in one step with every
# asset attached; nothing is uploaded after that.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, X.Y.Z (no leading v)"
        required: true
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # A dispatch releases the default branch's head; a tag push releases the tagged commit.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.repository.default_branch || github.ref }}
          fetch-depth: 0

      - name: The version and tag this run releases
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION#v}"
            if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
              echo "::error::tag v$VERSION already exists. Pick a new version."
              exit 1
            fi
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$VERSION' is not an X.Y.Z version"; exit 1 ;;
          esac
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      # The qm version comes from .github/qm-version (shared with ci.yml). GitHub's recorded sha256 for
      # the asset is read BEFORE downloading, and the downloaded bytes must match it.
      - name: Install qm (version from .github/qm-version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          QM_VERSION="$(tr -d '[:space:]' < .github/qm-version)"
          case "$QM_VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::.github/qm-version holds '$QM_VERSION', not a vX.Y.Z qm release tag"; exit 1 ;;
          esac
          repo=Mercenaries-Fan-Build/mercs2-wad-simulator
          asset=qm-linux-x86_64
          want=$(gh api "repos/$repo/releases/tags/$QM_VERSION" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest") \
            || { echo "::error::qm release $QM_VERSION was not found in $repo -- check .github/qm-version"; exit 1; }
          if [ -z "$want" ]; then
            echo "::error::$asset is not in qm $QM_VERSION -- check .github/qm-version"
            exit 1
          fi
          want=${want#sha256:}
          gh release download "$QM_VERSION" --repo "$repo" --pattern "$asset" --output qm
          got=$(sha256sum qm | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then
            echo "::error::$asset failed verification -- expected $want, got $got"
            exit 1
          fi
          echo "qm $QM_VERSION verified: $got"
          chmod +x qm

      # Only on a dispatch: the first `version:` line is shipment.version (shipment: is the manifest's
      # first block after `format:`). The stamp is committed after every check below has passed.
      - name: Stamp shipment.version in manifest.yaml
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          sed -i "0,/^[[:space:]]*version:/s/^\([[:space:]]*\)version:.*/\1version: $VERSION/" manifest.yaml

      # mercs.ink reads manifest.yaml from the repo at the release tag, so the manifest at the tag must
      # carry the released version. On a tag push nothing is committed, so a mismatch fails the release
      # rather than being fixed up in the runner.
      - name: manifest.yaml names m2-sdk at the released version
        run: |
          set -euo pipefail
          want="${{ steps.v.outputs.version }}"
          info="$(./qm manifest-info manifest.yaml)"
          echo "$info"
          name="$(jq -r .name <<< "$info")"
          version="$(jq -r .version <<< "$info")"
          if [ "$name" != "m2-sdk" ]; then
            echo "::error::manifest.yaml's shipment.name is '$name', not m2-sdk"
            exit 1
          fi
          if [ "$version" != "$want" ]; then
            echo "::error::the release is $want but manifest.yaml's shipment.version is '$version'. Commit manifest.yaml at $want and tag again, or release through the workflow dispatch."
            exit 1
          fi

      - name: Install the 32-bit MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686

      # m2-sdk.dll is built from the mercs2_mod_runtime release the Makefile pins (RUNTIME_VERSION),
      # downloaded from crates.io and checked against the sha256 the index records. The crate's
      # rust-toolchain.toml pins rustc; rustup installs it on the first cargo call. The released version
      # is injected into the DLL, so m2_version_num()/m2_version_string() match it; an untagged build
      # reports 0.0.0.
      - name: Build m2-sdk.dll (the released version injected)
        run: make build VERSION="${{ steps.v.outputs.version }}"

      - name: It is a 32-bit PE that carries the released version
        run: |
          set -euo pipefail
          file build/m2-sdk.dll | grep -q "PE32 .*80386" \
            || { echo "::error::m2-sdk.dll is not a 32-bit PE"; exit 1; }
          want="${{ steps.v.outputs.version }}"
          strings build/m2-sdk.dll | grep -qF "$want" \
            || { echo "::error::m2-sdk.dll does not carry version $want"; exit 1; }

      # A consumer that links but does not bind is the failure this catches — it compiles clean and
      # only fails on a player's machine.
      - name: A consumer links against the built DLL
        run: make -C test/consumer verify

      # manifest.yaml declares src/m2-sdk.dll, a copy of the build output. src/ is gitignored.
      - name: Stage the Shipment's runtime DLL
        run: |
          set -euo pipefail
          if [ ! -f build/m2-sdk.dll ]; then
            echo "::error::build/m2-sdk.dll is missing, so src/m2-sdk.dll cannot be staged for the Shipment"
            exit 1
          fi
          mkdir -p src
          cp build/m2-sdk.dll src/m2-sdk.dll
          cmp build/m2-sdk.dll src/m2-sdk.dll
          echo "staged build/m2-sdk.dll -> src/m2-sdk.dll ($(wc -c < src/m2-sdk.dll) bytes)"

      # Refuse to release a Shipment that does not lint. Gated on the exit code, not on printed output.
      - name: Lint the Shipment before releasing it
        run: ./qm lint .

      # Headers too: a mod author who is not using the submodule needs them to compile at all.
      - name: Package the DLL, import library and headers
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          mkdir -p dist
          cp build/m2-sdk.dll build/libm2-sdk.dll.a dist/
          zip -j "dist/m2-sdk-${TAG}-headers.zip" m2/*.h
          ls -la dist

      # m2-sdk-v<version>.zip is the asset Modkit selects by exact name. It carries the manifest, the
      # staged DLL, the SDK's license and MinHook's, since MinHook is compiled into the DLL.
      - name: Package the Shipment zip
        run: |
          set -euo pipefail
          ASSET="dist/m2-sdk-${{ steps.v.outputs.tag }}.zip"
          rm -f "$ASSET"
          zip -r "$ASSET" manifest.yaml src LICENSE LICENSE-MinHook.txt
          # List first, then search the list: piping unzip straight into `grep -q` under pipefail can
          # fail on SIGPIPE when grep exits at the first match.
          MEMBERS="$(unzip -Z1 "$ASSET")"
          grep -qx 'manifest.yaml' <<< "$MEMBERS" || { echo "::error::$ASSET is missing manifest.yaml"; exit 1; }
          grep -qx 'src/m2-sdk.dll' <<< "$MEMBERS" || { echo "::error::$ASSET is missing src/m2-sdk.dll"; exit 1; }
          unzip -l "$ASSET"

      # The DLL inside the Shipment must be the same bytes as the loose m2-sdk.dll asset.
      - name: The Shipment's DLL is the released DLL
        run: |
          set -euo pipefail
          ASSET="dist/m2-sdk-${{ steps.v.outputs.tag }}.zip"
          rm -rf _zipcheck
          mkdir _zipcheck
          unzip -q "$ASSET" src/m2-sdk.dll -d _zipcheck
          cmp _zipcheck/src/m2-sdk.dll dist/m2-sdk.dll
          echo "the Shipment's src/m2-sdk.dll matches dist/m2-sdk.dll"

      # Only on a dispatch, and only after every check above: commit the stamp to the default branch
      # (when the manifest was not already at this version) and push the tag on that commit.
      - name: Commit the stamp and tag it
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          VERSION="${{ steps.v.outputs.version }}"
          TAG="${{ steps.v.outputs.tag }}"
          BRANCH="${{ github.event.repository.default_branch }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- manifest.yaml; then
            echo "manifest.yaml is already at $VERSION; tagging the current commit"
          else
            git add manifest.yaml
            git commit -m "manifest.yaml: version $VERSION for release $TAG"
            git push origin "HEAD:$BRANCH"
          fi
          git tag "$TAG"
          git push origin "$TAG"

      # One step creates the release with every asset attached; nothing is uploaded after it is
      # published.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ steps.v.outputs.tag }}"
          gh release create "$TAG" \
            dist/m2-sdk.dll \
            dist/libm2-sdk.dll.a \
            "dist/m2-sdk-${TAG}-headers.zip" \
            "dist/m2-sdk-${TAG}.zip" \
            --verify-tag --title "$TAG" --generate-notes
