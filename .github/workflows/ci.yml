name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the 32-bit MinGW cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-i686

      # Mercenaries 2 is a 32-bit process, so this is the only target that matters.
      - name: Build m2-sdk.dll
        run: make build

      - name: It is a 32-bit PE with the exports consumers bind to
        run: |
          set -euo pipefail
          file build/m2-sdk.dll | grep -q "PE32 .*80386" \
            || { echo "::error::m2-sdk.dll is not a 32-bit PE"; exit 1; }
          for sym in m2_hook_attach m2_logf_mod m2_loghook_add_listener \
                     m2_loadtrigger_on_phase m2_version_num \
                     m2_shader_add_pixel m2_shader_add_vertex m2_shader_outcome \
                     m2_shader_status_name; do
            i686-w64-mingw32-objdump -p build/m2-sdk.dll | grep -q " $sym$" \
              || { echo "::error::m2-sdk.dll does not export $sym"; exit 1; }
          done
          echo "exports verified"

      # The shader registry's core (m2/m2_shader_core.c) has no Windows dependency, so its
      # validation, hash, pool lookup and admission rules run here with the host compiler.
      - name: Shader registry core tests
        run: make -C test/shader_core check

      # ★ The check that catches what compiling cannot. A mod that fails to bind to the shared layer
      # still compiles — it just silently links a private copy, or fails to load on a player's
      # machine with 0x8007007E and no reason given. Only the import table settles it.
      - name: A consumer links against the shared layer
        run: make -C test/consumer verify

      # ---- The Quartermaster Shipment (manifest.yaml) ----------------------------------------------
      # manifest.yaml declares src/m2-sdk.dll, a copy of the build output. src/ is gitignored, and qm
      # refuses a declared source that does not exist, so it is staged here. A missing build output
      # fails the job.
      - name: Stage the Shipment's runtime DLL
        run: |
          set -euo pipefail
          if [ ! -f build/m2-sdk.dll ]; then
            echo "::error::build/m2-sdk.dll is missing, so src/m2-sdk.dll cannot be staged for the Shipment"
            exit 1
          fi
          mkdir -p src
          cp build/m2-sdk.dll src/m2-sdk.dll
          cmp build/m2-sdk.dll src/m2-sdk.dll
          echo "staged build/m2-sdk.dll -> src/m2-sdk.dll ($(wc -c < src/m2-sdk.dll) bytes)"

      # `qm` ships as a prebuilt binary. The version comes from .github/qm-version (shared with
      # release.yml). The expected sha256 is read from GitHub's own record of the release asset BEFORE
      # downloading, so the check is against what the release claims to hold rather than against the
      # bytes that happened to arrive.
      - name: Install qm (version from .github/qm-version)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          QM_VERSION="$(tr -d '[:space:]' < .github/qm-version)"
          case "$QM_VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::.github/qm-version holds '$QM_VERSION', not a vX.Y.Z qm release tag"; exit 1 ;;
          esac
          repo=Mercenaries-Fan-Build/mercs2-wad-simulator
          asset=qm-linux-x86_64
          want=$(gh api "repos/$repo/releases/tags/$QM_VERSION" \
            --jq ".assets[] | select(.name == \"$asset\") | .digest") \
            || { echo "::error::qm release $QM_VERSION was not found in $repo -- check .github/qm-version"; exit 1; }
          if [ -z "$want" ]; then
            echo "::error::$asset is not in qm $QM_VERSION -- check .github/qm-version"
            exit 1
          fi
          want=${want#sha256:}
          gh release download "$QM_VERSION" --repo "$repo" --pattern "$asset" --output qm
          got=$(sha256sum qm | cut -d' ' -f1)
          if [ "$want" != "$got" ]; then
            echo "::error::$asset failed verification -- expected $want, got $got"
            exit 1
          fi
          echo "qm $QM_VERSION verified: $got"
          chmod +x qm

      # Hermetic: no game install and no retail WADs. Gated on the exit code, not on what gets printed.
      - name: Lint the Shipment
        run: ./qm lint .

      - name: The manifest's name and version
        run: ./qm manifest-info manifest.yaml

  ladder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # m2/load_ladder.gen.{h,c} are generated from loadprobe's phases.rs, which lives in another
      # repo. Without that checkout there is nothing to compare against, and a guard that silently
      # passes when it cannot run is worse than no guard — so a failed checkout fails the job.
      - name: Check out loadprobe's source of truth
        uses: actions/checkout@v4
        with:
          repository: Mercenaries-Fan-Build/mercs2-wad-simulator
          path: .loadprobe
          sparse-checkout: crates/loadprobe/src
          sparse-checkout-cone-mode: false

      # The drift is silent in the game: m2_loadtrigger just stops matching milestones loadprobe has
      # renamed, and no mod reports anything. This target existed unwired for months.
      - name: The world-load ladder has not drifted
        run: make ladder-check PHASES=.loadprobe/crates/loadprobe/src/phases.rs
